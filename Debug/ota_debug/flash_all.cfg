# Flashes the bootloader (Sectors 0-1) and the application (Sectors 2-5).
# Run from the workspace root:
#   openocd -s <scripts> -f interface/stlink.cfg -f target/stm32f4x.cfg \
#           -c "tcl_port disabled" -f Debug/ota_debug/flash_all.cfg
init
reset halt

echo "=== writing BOOTLOADER (0x08000000-0x08007FFF) ==="
flash write_image erase "bootloader/bootloader.hex"

echo "=== writing APPLICATION (0x08008000-0x0803FFFF) ==="
flash write_image erase "Debug/fixed project.hex"

echo "=== verifying ==="
verify_image "bootloader/bootloader.hex"
verify_image "Debug/fixed project.hex"

echo "=== resetting into the bootloader ==="
reset run
